const ROLES = ["arbitre", "j1", "j2"];
const ROLE_LABEL = { arbitre: "Arbitre", j1: "Joueur 1", j2: "Joueur 2" };

// ===== Outils =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let uid = localStorage.getItem("uid");
if (!uid) { uid = Math.random().toString(36).slice(2, 12); localStorage.setItem("uid", uid); }

const code = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
let room = null, loaded = false, chosenDur = 60;

function genCode() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function ref(path = "") { return db.ref(`rooms/${code}${path}`); }
function myRole() { return room ? (ROLES.find(r => room.roles?.[r] === uid) || null) : null; }
function nameOf(role) {
  const id = room?.roles?.[role];
  return id ? (room.players?.[id]?.name || "?") : "—";
}
// Le chrono ne tourne que pour le joueur dont c'est le tour
function remainOf(role, now = Date.now()) {
  const base = room?.remain?.[role] ?? 0;
  return (room?.status === "playing" && room.turn === role) ? base - (now - room.turnStart) : base;
}
function fmt(ms) { return Math.max(0, Math.ceil(ms / 1000)) + " s"; }
function pickChar(exclude) {
  const pool = CHARACTERS.filter(c => !exclude[c.id]);
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

// ===== Salon =====
async function createRoom() {
  const name = $("pseudo").value.trim();
  if (!name) return alert("Mets un pseudo !");
  const c = genCode();
  await db.ref("rooms/" + c).set({
    host: uid, status: "lobby", createdAt: Date.now(),
    players: { [uid]: { name } }, roles: {}
  });
  location.href = "?room=" + c;
}
function joinByCode() {
  const c = $("codeInput").value.trim().toUpperCase();
  if (c) location.href = "?room=" + c;
}
async function joinRoom() {
  const name = $("pseudo").value.trim();
  if (!name) return alert("Mets un pseudo !");
  await ref(`/players/${uid}`).update({ name });
}
async function claimRole(role) {
  const res = await ref(`/roles/${role}`).transaction(cur => (cur && cur !== uid) ? undefined : uid);
  if (!res.committed) return alert("Ce rôle est déjà pris !");
  for (const r of ROLES) {
    if (r !== role && room.roles?.[r] === uid) await ref(`/roles/${r}`).set(null);
  }
}
async function releaseRole() {
  const r = myRole();
  if (r) await ref(`/roles/${r}`).set(null);
}

// ===== Partie =====
async function startGame() {
  if (!ROLES.every(r => room.roles?.[r])) return alert("Il faut un Arbitre, un Joueur 1 et un Joueur 2.");
  const ch = pickChar({});
  if (!ch) return alert("Aucun perso disponible.");
  const d = Math.min(100, Math.max(40, Number(chosenDur) || 60)) * 1000;
  const now = Date.now();
  await ref().update({
    status: "playing", turn: "j1", turnStart: now,
    remain: { j1: d, j2: d }, score: { j1: 0, j2: 0 },
    used: {}, charId: ch.id, winner: null, reason: null
  });
}

// "Bon" : le joueur actif a trouvé, c'est à l'autre de jouer
async function arbBon() {
  const role = room.turn, now = Date.now();
  const left = remainOf(role, now);
  const other = role === "j1" ? "j2" : "j1";
  const used = { ...(room.used || {}), [room.charId]: true };
  const remain = { ...room.remain, [role]: Math.max(0, left) };
  const score = { ...(room.score || {}), [role]: (room.score?.[role] || 0) + 1 };
  const next = pickChar(used);
  if (!next) {
    return ref().update({
      status: "finished", remain, score, used, charId: null,
      winner: remain.j1 >= remain.j2 ? "j1" : "j2", reason: "Plus de persos !"
    });
  }
  await ref().update({ remain, score, used, charId: next.id, turn: other, turnStart: now });
}

// "Pas bon" : même joueur, il reçoit un autre perso
async function arbPasBon() {
  const role = room.turn, now = Date.now();
  const left = remainOf(role, now);
  const used = { ...(room.used || {}), [room.charId]: true };
  const remain = { ...room.remain, [role]: Math.max(0, left) };
  const next = pickChar(used);
  if (!next) {
    return ref().update({
      status: "finished", remain, used, charId: null,
      winner: remain.j1 >= remain.j2 ? "j1" : "j2", reason: "Plus de persos !"
    });
  }
  await ref().update({ remain, used, charId: next.id, turnStart: now });
}

async function rejouer() {
  await ref().update({
    status: "lobby", used: null, charId: null, turn: null, turnStart: null,
    remain: null, score: null, winner: null, reason: null
  });
}

function renderHome() {
  $("app").innerHTML = `<div class="card"><h2>🎌 Coup Fatal Anime</h2>
    <input id="pseudo" placeholder="Ton pseudo"><br>
    <button onclick="createRoom()">Créer une partie privée</button>
    <hr>
    <input id="codeInput" placeholder="Code de la partie"><br>
    <button onclick="joinByCode()">Rejoindre</button></div>`;
}

function lobbyHTML(players, isHost, mine) {
  const rolesHTML = ROLES.map(r => {
    const taken = room.roles?.[r];
    const who = taken ? (players[taken]?.name || "?") : "libre";
    let btn = "";
    if (mine === r) btn = `<button onclick="releaseRole()">Quitter ce rôle</button>`;
    else if (!taken) btn = `<button onclick="claimRole('${r}')">Choisir ${ROLE_LABEL[r]}</button>`;
    return `<p><b>${ROLE_LABEL[r]}</b> : ${esc(who)}<br>${btn}</p>`;
  }).join("");
  const ready = ROLES.every(r => room.roles?.[r]);
  return `<div class="card"><h2>Salon ${code}</h2>
    <p>Envoie ce lien à tes potes :</p>
    <input value="${location.origin}${location.pathname}?room=${code}" readonly onclick="this.select()">
    <p>${Object.keys(players).length} joueur(s) dans le salon</p></div>
    <div class="card"><h3>Rôles</h3>${rolesHTML}</div>
    ${isHost ? `<div class="card">
      <p>⏱️ Temps par joueur : <b><span id="durVal">${chosenDur}</span> s</b></p>
      <input type="range" min="40" max="100" value="${chosenDur}" style="width:80%"
        oninput="chosenDur=this.value;$('durVal').textContent=this.value"><br>
      <button onclick="startGame()" ${ready ? "" : "disabled"}>Lancer la partie</button>
      ${ready ? "" : `<p class="small">Il faut un Arbitre, un Joueur 1 et un Joueur 2.</p>`}
    </div>` : `<p>En attente de l'hôte…</p>`}`;
}

function gameHTML(players, isHost, mine) {
  const now = Date.now();
  const turnRole = room.turn;
  const playing = room.status === "playing";
  const ch = room.charId ? CHARACTERS.find(c => c.id === room.charId) : null;

  const playerBox = r => `<div class="player ${playing && turnRole === r ? "active" : ""}">
      <b>${ROLE_LABEL[r]}</b><br>${esc(nameOf(r))}<br>
      <div class="clock" id="clock-${r}">${fmt(remainOf(r, now))}</div>
      ${playing && turnRole === r ? "🎯 À lui de deviner" : ""}
    </div>`;

  let center = "";
  if (room.status === "finished") {
    center = `<h2>🏁 Gagnant : ${ROLE_LABEL[room.winner] || "?"} (${esc(nameOf(room.winner))})</h2>
      <p>${esc(room.reason || "")}</p>
      ${isHost ? `<button onclick="rejouer()">Rejouer</button>` : ""}`;
  } else if (mine === "arbitre") {
    center = `<p>🎙️ <b>Arbitre</b> : le perso est</p>
      <div class="name">${ch ? esc(ch.name) : "—"}</div>
      <p class="small">${esc(nameOf(turnRole))} doit le deviner à l'oral.</p>
      <button class="ok" onclick="arbBon()">✅ Bon</button>
      <button class="bad" onclick="arbPasBon()">❌ Pas bon</button>`;
  } else {
    // Si l'image ne charge pas, on affiche ❓ à la place de l'icône cassée
    const img = ch?.img
      ? `<img class="perso" src="${esc(ch.img)}" onerror="this.outerHTML='<div class=big>❓</div>'">`
      : `<div class="big">❓</div>`;
    const msg = mine === turnRole
      ? `<p class="ok-txt">C'est ton tour : devine à l'oral !</p>`
      : `<p class="small">Tour de ${esc(nameOf(turnRole))}</p>`;
    center = `${img}${msg}`;
  }

  return `<div class="card"><h2>Partie ${code}</h2>
    <div class="row">${playerBox("j1")}${playerBox("j2")}</div>
    <p class="small">Bons persos : J1 ${room.score?.j1 || 0} – J2 ${room.score?.j2 || 0}</p>
  </div>
  <div class="card">${center}</div>`;
}

function render() {
  if (!code) return renderHome();
  if (!loaded) return;
  if (!room) {
    $("app").innerHTML = `<div class="card"><p>Partie introuvable 😕</p><a href="./" style="color:#ff9f1c">Retour à l'accueil</a></div>`;
    return;
  }
  const players = room.players || {};
  if (!players[uid]) {
    $("app").innerHTML = `<div class="card"><h2>Rejoindre la partie ${code}</h2>
      <input id="pseudo" placeholder="Ton pseudo"><br>
      <button onclick="joinRoom()">Entrer</button></div>`;
    return;
  }
  const isHost = room.host === uid;
  const mine = myRole();
  $("app").innerHTML = room.status === "lobby"
    ? lobbyHTML(players, isHost, mine)
    : gameHTML(players, isHost, mine);
}

// ===== Écoute en temps réel =====
if (code) {
  ref().on("value", snap => { room = snap.val(); loaded = true; render(); });
} else {
  render();
}

// ===== Chronos + fin de temps =====
setInterval(() => {
  if (!room) return;
  const now = Date.now();
  ["j1", "j2"].forEach(r => {
    const el = $("clock-" + r);
    if (el) el.textContent = fmt(remainOf(r, now));
  });
  if (room.status === "playing" && room.turn && remainOf(room.turn, now) <= 0) {
    const loser = room.turn;
    const winner = loser === "j1" ? "j2" : "j1";
    ref().update({
      status: "finished", winner,
      reason: `Temps écoulé pour ${ROLE_LABEL[loser]}`,
      remain: { ...room.remain, [loser]: 0 }
    });
  }
}, 250);
</script>
</body>
</html>
