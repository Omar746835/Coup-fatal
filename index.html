<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coup Fatal Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{--card:#111a36;--line:#26345e;--gold:#c9a13b;--gold2:#f0c75e;--green:#5dbb63;--green2:#2f7a36;--blue:#4a6fe0;--red:#e53935;--ok:#4caf50;--txt:#eef2ff;--mut:#a9b4d8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--txt);font-family:'Lilita One',Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#1a2a5e 0%,#0b1126 55%,#060915 100%);padding:14px;text-align:center}
  .bang{font-family:'Bangers',Impact,sans-serif;letter-spacing:2px;font-weight:400;margin:0}
  .wrap{max-width:460px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .panel.c{text-align:center}
  .hero{display:flex;gap:14px;align-items:center;margin-bottom:8px}
  .logo{width:72px;height:72px;border-radius:18px;background:var(--blue);display:grid;place-items:center;font-size:38px;flex:none;box-shadow:0 6px 0 #2a4aa0}
  h1.bang{font-size:44px;line-height:.95}
  .sub{color:var(--mut);font-size:17px;line-height:1.4;margin:10px 0}
  h2.sec{font-size:24px;margin:16px 0 8px;color:#e8ecff}
  .step{display:flex;gap:12px;margin:12px 0}
  .num{width:42px;height:42px;border-radius:50%;background:linear-gradient(#e0b54e,#a9822b);display:grid;place-items:center;font-family:'Bangers',Impact;font-size:24px;color:#fff;flex:none;box-shadow:0 3px 0 #6e541b}
  .step b{display:block;font-size:19px}
  .step span{color:var(--mut);font-size:15px;line-height:1.35}
  .btn{display:block;width:100%;border:none;border-radius:8px;padding:14px 12px;font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:2px;color:#fff;background:linear-gradient(#6ccc70,var(--green2));box-shadow:0 6px 0 #1d4f22;cursor:pointer;margin:10px 0}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #1d4f22}
  .btn.gold{background:linear-gradient(#f2d06a,#b8892a);box-shadow:0 6px 0 #6e541b;color:#1a1204}
  .btn.red{background:linear-gradient(#ef5350,#b71c1c);box-shadow:0 6px 0 #6b0f0f}
  .btn.blue{background:linear-gradient(#5f86ff,#2e4fb8);box-shadow:0 6px 0 #1b3078}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .arb-line{display:flex;gap:8px;justify-content:center}
  .arb-line .btn{width:48%}
  input:not([type=range]){width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:#0b1330;color:#fff;font-size:18px;font-family:'Lilita One',Arial;margin:6px 0}
  input[type=range]{width:100%;accent-color:var(--gold2)}
  .note{background:#1c2748;border-radius:8px;padding:10px 12px;color:var(--mut);font-size:14px;margin:10px 0}
  .players{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .prow{display:flex;justify-content:space-between;align-items:center;background:#0c1431;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:18px}
  .badge{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--gold);color:#1a1204;font-family:'Bangers',Impact;letter-spacing:1px}
  .badge.g{background:var(--green2);color:#fff}
  .board{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pl{flex:1 1 100px;max-width:150px;background:#0c1431;border:2px solid var(--line);border-radius:12px;padding:8px;opacity:.7;transition:all .3s}
  .pl.on{opacity:1;border-color:var(--gold2);box-shadow:0 0 14px rgba(240,199,94,.35)}
  .pn{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc{font-family:'Bangers',Impact;font-size:28px;color:var(--gold2)}
  .pc.low{color:var(--red);animation:blink .5s infinite alternate}
  .pscore{font-size:13px;color:var(--mut)}
  .frame{margin:12px auto;max-width:360px;border-radius:16px;border:6px solid #2a3868;background:#070c1f;padding:6px;transition:border-color .25s,box-shadow .25s}
  .frame img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:10px}
  .frame .q{font-family:'Bangers',Impact;font-size:96px;padding:50px 0;color:#7d8ab8}
  .frame.fb-ok{border-color:var(--ok);box-shadow:0 0 0 4px rgba(76,175,80,.35),0 0 30px rgba(76,175,80,.7);animation:pop .45s ease}
  .frame.fb-bad{border-color:var(--red);box-shadow:0 0 0 4px rgba(229,57,53,.35),0 0 30px rgba(229,57,53,.7);animation:shake .45s ease}
  .name{font-family:'Bangers',Impact;font-size:34px;letter-spacing:2px;color:var(--gold2);margin:6px 0;min-height:40px;text-shadow:0 3px 0 #5b4415}
  .result{font-size:20px;margin:8px 0;min-height:28px}
  .ok-t{color:#8ef08e}.bad-t{color:#ff8a80}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes blink{from{opacity:1}to{opacity:.35}}
</style>
</head>

// ===== 3. OUTILS =====
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let uid = localStorage.getItem("uid");
if (!uid) { uid = Math.random().toString(36).slice(2, 12); localStorage.setItem("uid", uid); }
const savedName = localStorage.getItem("pseudo") || "";

const code = (new URLSearchParams(location.search).get("room") || "").toUpperCase();
let room = null, loaded = false, offset = 0, chosenDur = 60;
let busy = false, endingFlag = false;

// Heure serveur : tous les téléphones comptent le même temps
db.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });
const srv = () => Date.now() + offset;

const R = (p = "") => db.ref(`rooms/${code}${p}`);
const genCode = () => Math.random().toString(36).slice(2, 8).toUpperCase();
const clampDur = v => Math.min(100, Math.max(40, Number(v) || 60));
const clampMax = v => Math.min(10, Math.max(3, Number(v) || 4));

function pseudoVal(id = "pseudo") {
  const v = ($(id)?.value || savedName).trim();
  if (v) localStorage.setItem("pseudo", v);
  return v;
}
function playersList() {
  return Object.entries(room?.players || {}).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
}
function nameOf(id) { return room?.players?.[id]?.name || "?"; }
function cur() { return room?.order?.[(room.turnIdx || 0) % (room.order?.length || 1)]; }
function remainOf(id, t = srv()) {
  const base = room?.remain?.[id] ?? 0;
  if (room?.status === "playing" && room.phase === "guess" && cur() === id) return base - (t - room.turnStart);
  return base;
}
function fmt(ms) { return Math.max(0, Math.ceil(ms / 1000)) + " s"; }
function pickChar(used) {
  const pool = CHARACTERS.filter(c => !used?.[c.id]);
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

// ===== 4. ACCUEIL =====
function renderHome() {
  $("app").innerHTML = `
  <div class="panel">
    <div class="hero">
      <div class="logo">⚔️</div>
      <div><h1 class="bang">COUP FATAL<br>ANIME</h1></div>
    </div>
    <p class="sub">Devine le perso à l'oral, entre amis. Un arbitre valide les réponses.</p>
  </div>
  <div class="panel">
    <h2 class="sec bang">COMMENT ÇA MARCHE</h2>
    <div class="step"><div class="num">1</div><div><b>Crée un salon</b><span>Choisis le nombre de participants, de 3 à 10.</span></div></div>
    <div class="step"><div class="num">2</div><div><b>Invite tes amis</b><span>Envoie-leur le lien du salon.</span></div></div>
    <div class="step"><div class="num">3</div><div><b>Lance la partie</b><span>L'arbitre voit le perso, les joueurs devinent à l'oral.</span></div></div>
    <input id="pseudo" type="text" placeholder="Ton pseudo" value="${esc(savedName)}" maxlength="16">
    <button class="btn" onclick="createRoom()">+ CRÉER UN SALON</button>
    <input id="codeInput" type="text" placeholder="Code du salon" maxlength="8">
    <button class="btn blue" onclick="joinByCode()">REJOINDRE</button>
    <div class="note">Parties privées : seul le lien du salon permet d'entrer.</div>
  </div>`;
}
async function createRoom() {
  const name = pseudoVal();
  if (!name) return alert("Mets un pseudo !");
  const c = genCode();
  await db.ref(`rooms/${c}`).set({
    host: uid, status: "lobby", max: 4,
    players: { [uid]: { name, joinedAt: Date.now() } }
  });
  location.href = "?room=" + c;
}
function joinByCode() {
  const c = ($("codeInput").value || "").trim().toUpperCase();
  if (c) location.href = "?room=" + c;
}

// ===== 5. REJOINDRE =====
function renderJoin() {
  const started = room.status !== "lobby";
  const full = playersList().length >= (room.max || 4);
  $("app").innerHTML = `<div class="panel c">
    <h1 class="bang">REJOINDRE<br>LE SALON ${code}</h1>
    ${started ? `<p class="sub">La partie a déjà commencé.</p>`
      : full ? `<p class="sub">Le salon est complet.</p>`
      : `<input id="pjoin" type="text" placeholder="Ton pseudo" value="${esc(savedName)}" maxlength="16">
         <button class="btn" onclick="joinRoom()">ENTRER</button>`}
  </div>`;
}
async function joinRoom() {
  const name = pseudoVal("pjoin");
  if (!name) return alert("Mets un pseudo !");
  if (playersList().length >= (room.max || 4)) return alert("Salon complet !");
  await R(`/players/${uid}`).set({ name, joinedAt: Date.now() });
}

// ===== 6. SALON =====
function renderLobby() {
  endingFlag = false;
  const list = playersList();
  const max = room.max || 4;
  const isHost = room.host === uid;
  const isArb = room.arbitre === uid;
  const canStart = isHost && list.length >= 3 && !!room.arbitre;
  const rows = list.map(([id, p]) => `
    <div class="prow">
      <span>${esc(p.name)} ${id === room.host ? '<span class="badge g">HÔTE</span>' : ""}</span>
      ${room.arbitre === id ? '<span class="badge">ARBITRE</span>' : ""}
    </div>`).join("");
  const arbBtn = !room.arbitre
    ? `<button class="btn gold" onclick="becomeArbitre()">JE SERAI L'ARBITRE</button>`
    : isArb
      ? `<button class="btn red" onclick="releaseArbitre()">QUITTER L'ARBITRAGE</button>`
      : `<div class="note">Arbitre : <b>${esc(nameOf(room.arbitre))}</b></div>`;

  $("app").innerHTML = `
  <div class="panel">
    <div class="hero"><div class="logo">⚔️</div><div><h1 class="bang">SALON<br>${code}</h1></div></div>
    <p class="sub">Envoie ce lien à tes amis :</p>
    <input type="text" readonly value="${location.origin}${location.pathname}?room=${code}" onclick="this.select()">
  </div>
  <div class="panel">
    <h2 class="sec bang">PARTICIPANTS ${list.length}/${max}</h2>
    <div class="players">${rows}</div>
    ${arbBtn}
  </div>
  ${isHost ? `
  <div class="panel">
    <h2 class="sec bang">NOMBRE DE PARTICIPANTS : <span id="maxVal">${max}</span></h2>
    <input type="range" min="3" max="10" value="${max}"
      oninput="$('maxVal').textContent=this.value" onchange="setMax(this.value)">
    <div class="note">Entre 3 et 10 participants, arbitre compris.</div>
    <h2 class="sec bang">TEMPS PAR JOUEUR : <span id="durVal">${chosenDur}</span> s</h2>
    <input type="range" min="40" max="100" value="${chosenDur}"
      oninput="chosenDur=this.value;$('durVal').textContent=this.value">
    <button class="btn gold" ${canStart ? "" : "disabled"} onclick="startGame()">LANCER LA PARTIE</button>
    ${canStart ? "" : `<div class="note">Il faut au moins 3 participants et un arbitre.</div>`}
  </div>` : `<div class="panel"><p class="sub">En attente de l'hôte…</p></div>`}`;
}
async function setMax(v) {
  const n = clampMax(v);
  if (playersList().length > n) { alert("Trop de joueurs dans le salon pour ce nombre."); return render(); }
  await R("/max").set(n);
}
async function becomeArbitre() {
  const res = await R("/arbitre").transaction(c => (c && c !== uid) ? undefined : uid);
  if (!res.committed) alert("Un arbitre est déjà choisi !");
}
async function releaseArbitre() { await R("/arbitre").set(null); }

// ===== 7. PARTIE =====
async function startGame() {
  const list = playersList();
  if (list.length < 3) return alert("Il faut au moins 3 participants.");
  if (!room.arbitre) return alert("Choisis un arbitre.");
  const order = list.map(([id]) => id).filter(id => id !== room.arbitre).sort(() => Math.random() - 0.5);
  const ch = pickChar({});
  const d = clampDur(chosenDur) * 1000;
  const remain = {}, score = {};
  order.forEach(id => { remain[id] = d; score[id] = 0; });
  await R().update({
    status: "playing", order, turnIdx: 0, remain, score, used: {},
    charId: ch.id, phase: "guess", turnStart: srv(),
    fb: null, lastName: null, winner: null, reason: null
  });
}

// L'arbitre valide : Bon (true) ou Pas bon (false)
async function judge(ok) {
  if (busy || !room || room.status !== "playing" || room.phase !== "guess" || room.arbitre !== uid) return;
  busy = true;
  const t = srv();
  const g = cur();
  const left = Math.max(0, remainOf(g, t));
  const remain = { ...room.remain, [g]: left };
  const score = { ...(room.score || {}) };
  if (ok) score[g] = (score[g] || 0) + 1;
  const used = { ...(room.used || {}), [room.charId]: true };
  const ch = CHARACTERS.find(c => c.id === room.charId);
  await R().update({
    phase: "feedback", remain, score, used, turnStart: null,
    lastName: ch ? ch.name : null, fb: { ok, uid: g, at: t }
  });
  setTimeout(() => nextStep(ok, g).finally(() => { busy = false; }), 1000);
}

// Après la pause d'une seconde : perso suivant ou changement de joueur
async function nextStep(ok, g) {
  const snap = await R().once("value");
  const r = snap.val();
  if (!r || r.status !== "playing" || r.phase !== "feedback") return;
  if ((r.remain?.[g] ?? 0) <= 0) return endGame(r, g, `Temps écoulé pour ${r.players?.[g]?.name || "?"}`);
  const pool = CHARACTERS.filter(c => !(r.used || {})[c.id]);
  if (!pool.length) return endGame(r, null, "Plus de persos !");
  let turnIdx = r.turnIdx || 0;
  if (ok) turnIdx = (turnIdx + 1) % r.order.length;
  const ch = pool[Math.floor(Math.random() * pool.length)];
  await R().update({
    phase: "guess", turnIdx, charId: ch.id, turnStart: srv(),
    lastName: null, fb: null
  });
}

// Fin : celui à zéro perd, le gagnant est le meilleur score (puis le plus de temps)
async function endGame(r, loser, reason) {
  const ids = r.order.filter(id => id !== loser);
  ids.sort((a, b) => ((r.score?.[b] || 0) - (r.score?.[a] || 0)) || ((r.remain?.[b] || 0) - (r.remain?.[a] || 0)));
  await R().update({ status: "finished", phase: null, fb: null, winner: ids[0] || null, reason });
}

async function rejouer() {
  await R().update({
    status: "lobby", phase: null, fb: null, order: null, remain: null, score: null,
    used: null, charId: null, turnIdx: null, turnStart: null, lastName: null,
    winner: null, reason: null
  });
}

function renderGame() {
  const t = srv();
  const isArb = room.arbitre === uid;
  const g = cur();
  const ch = room.charId ? CHARACTERS.find(c => c.id === room.charId) : null;
  const fb = room.phase === "feedback" ? room.fb : null;
  const frameCls = fb ? (fb.ok ? "fb-ok" : "fb-bad") : "";
  const order = room.order || [];

  if (room.status === "finished") {
    $("app").innerHTML = `<div class="panel c">
      <h1 class="bang">🏁 PARTIE TERMINÉE</h1>
      <p class="sub">${esc(room.reason || "")}</p>
      <h2 class="bang" style="color:var(--gold2)">🏆 ${esc(room.winner ? nameOf(room.winner) : "Personne")}</h2>
      ${(room.host === uid || isArb) ? `<button class="btn gold" onclick="rejouer()">REJOUER</button>` : ""}
    </div>`;
    return;
  }

  const board = order.map(id => {
    const on = room.phase === "guess" && id === g;
    return `<div class="pl ${on ? "on" : ""}">
      <div class="pn">${esc(nameOf(id))}</div>
      <div class="pc" id="clock-${id}">${fmt(remainOf(id, t))}</div>
      <div class="pscore">${room.score?.[id] || 0} bon(s)</div>
    </div>`;
  }).join("");

  const img = ch?.img
    ? `<img src="${esc(ch.img)}" alt="" onerror="this.outerHTML='<div class=q>❓</div>'">`
    : `<div class="q">❓</div>`;

  // Le nom : visible pour tous après la réponse, et pour l'arbitre pendant le tour
  const shownName = fb ? (room.lastName || ch?.name) : (isArb ? ch?.name : "");
  const nameHTML = `<div class="name">${esc(shownName || "")}</div>`;

  let result = "";
  if (fb) result = fb.ok
    ? `<span class="ok-t">✅ ${esc(nameOf(fb.uid))} a trouvé !</span>`
    : `<span class="bad-t">❌ Mauvaise réponse pour ${esc(nameOf(fb.uid))}</span>`;
  else if (g === uid) result = `<b style="color:#ffd166">C'est ton tour : devine à l'oral !</b>`;
  else result = `Tour de <b>${esc(nameOf(g))}</b>`;

  const canJudge = room.phase === "guess";
  const arbControls = isArb ? `
    <div class="arb-line">
      <button class="btn" ${canJudge ? "" : "disabled"} onclick="judge(true)">✅ BON</button>
      <button class="btn red" ${canJudge ? "" : "disabled"} onclick="judge(false)">❌ PAS BON</button>
    </div>` : "";

  $("app").innerHTML = `
  <div class="panel">
    <div class="board">${board}</div>
  </div>
  <div class="panel c">
    <div class="frame ${frameCls}">${img}</div>
    ${nameHTML}
    <div class="result">${result}</div>
    ${arbControls}
  </div>`;
}

// ===== 8. AIGUILLAGE =====
function render() {
  if (!code) return renderHome();
  if (!loaded) return;
  if (!room) {
    $("app").innerHTML = `<div class="panel c"><p>Partie introuvable 😕</p><button class="btn" onclick="location.href='./'">RETOUR</button></div>`;
    return;
  }
  if (!room.players?.[uid]) return renderJoin();
  if (room.status === "lobby") return renderLobby();
  return renderGame();
}

// Mise à jour des chronos + fin de temps (géré par l'arbitre)
setInterval(() => {
  if (!room || room.status !== "playing") return;
  const t = srv();
  (room.order || []).forEach(id => {
    const el = $("clock-" + id);
    if (!el) return;
    const v = remainOf(id, t);
    el.textContent = fmt(v);
    el.classList.toggle("low", v <= 5000 && room.phase === "guess" && cur() === id);
  });
  if (room.phase === "guess" && room.arbitre === uid && !endingFlag && remainOf(cur(), t) <= 0) {
    endingFlag = true;
    endGame(room, cur(), `Temps écoulé pour ${nameOf(cur())}`);
  }
}, 200);

// ===== 9. TEMPS RÉEL =====
if (code) {
  R().on("value", snap => { room = snap.val(); loaded = true; render(); });
} else {
  render();
}
</script>
